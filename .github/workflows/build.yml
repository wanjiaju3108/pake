name: Build ShifangFM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Pake source
        uses: actions/checkout@v4
        with:
          repository: tw93/Pake

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust (both targets for universal build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install

      - name: Build Pake CLI
        run: pnpm run cli:build

      - name: Package the app
        run: |
          node dist/cli.js "https://m.shifangfm.com" --name "荔课" --width 1280 --height 900 --targets universal

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: ShifangFM-dmg
          path: src-tauri/target/**/*.dmg
          if-no-files-found: error
