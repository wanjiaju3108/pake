name: Build ShifangFM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Pake source
        uses: actions/checkout@v4
        with:
          repository: tw93/Pake

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Intel (x86_64) target
        run: |
          rustup target add x86_64-apple-darwin
          rustup target list --installed

      - name: Install dependencies
        run: pnpm install

      - name: Build Pake CLI
        run: pnpm run cli:build

      - name: Package the app
        run: |
          node dist/cli.js "https://m.shifangfm.com" --name "ShifangFM" --width 1280 --height 900 --targets universal

      - name: Debug - locate build output
        if: always()
        run: |
          echo "===== 工作目录 ====="; pwd
          echo "===== 根目录内容 ====="; ls -la | head -40
          echo "===== 所有 dmg ====="; find "$GITHUB_WORKSPACE" -name "*.dmg" 2>/dev/null
          echo "===== 所有 .app ====="; find "$GITHUB_WORKSPACE" -maxdepth 8 -type d -name "*.app" 2>/dev/null | head
          echo "===== src-tauri/target ====="; ls -la src-tauri/target/ 2>/dev/null
          echo "===== bundle 目录 ====="; find "$GITHUB_WORKSPACE" -maxdepth 7 -type d -name "bundle" 2>/dev/null

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: ShifangFM-build
          path: |
            **/*.dmg
            **/*.app
          if-no-files-found: warn
